<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 24px; color: #1f2937; }
        .container { max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h1 { color: #1d4ed8; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #f8fafc; font-weight: 600; }
        .total { text-align: right; font-size: 18px; font-weight: bold; margin-top: 16px; }
        .footer { font-size: 12px; color: #6b7280; margin-top: 28px; border-top: 1px solid #e5e7eb; padding-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Order Confirmation</h1>
    <p>Dear <strong th:text="${customerName}">Customer</strong>,</p>
    <p>Thank you for your order! Your order reference is <strong th:text="${orderReference}">ORD-000</strong>.</p>

    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Unit Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.name}">Product Name</td>
            <td th:text="${product.quantity}">1</td>
            <td>$<span th:text="${product.price}">0.00</span></td>
        </tr>
        </tbody>
    </table>

    <div class="total">
        Total Amount: $<span th:text="${totalAmount}">0.00</span>
    </div>

    <div class="footer">
        &copy; 2026 SLA E-Commerce Platform. This is an automated confirmation.
    </div>
</div>
</body>
</html>
